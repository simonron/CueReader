<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>CueReader</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f4f4f5}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:#f4f4f5}.app{max-width:900px;margin:auto;padding:12px}.toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}.wide{grid-column:1/-1}button,select,input,textarea{font:inherit;font-size:16px}button,select,input[type=file]{min-height:46px;border:1px solid #c7c7cc;border-radius:10px;background:#fff;padding:9px 12px}button.primary{font-weight:700;background:#111827;color:white}.status{padding:8px 2px;font-size:14px;color:#4b5563}.script{background:white;border:1px solid #d1d5db;border-radius:12px;overflow:hidden}.cue{padding:13px 14px;border-bottom:1px solid #e5e7eb;font-size:20px;line-height:1.35;cursor:pointer}.cue:last-child{border-bottom:0}.cue.active{background:#fde68a;outline:3px solid #f59e0b;outline-offset:-3px}.speaker{font-weight:800;margin-bottom:4px}.mine .speaker{color:#1769aa}.paste{width:100%;min-height:150px;border:1px solid #c7c7cc;border-radius:10px;padding:10px;background:#fff}.credit{text-align:center;font-size:12px;color:#6b7280;margin:12px 0}.nav{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 0;background:linear-gradient(transparent,#f4f4f5 24%)}.nav button{font-size:21px;font-weight:700}.hidden{display:none}@media(min-width:700px){.toolbar{grid-template-columns:repeat(4,minmax(0,1fr))}.wide{grid-column:1/-1}.cue{font-size:21px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <input id="file" class="wide" type="file" accept=".txt,.pdf,.doc,.docx,text/plain,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
    <select id="role" aria-label="My role"><option value="">My role…</option></select>
    <button id="setRole">Set My Role</button>
    <select id="voice" aria-label="Voice"><option>System voice</option></select>
    <button id="testVoice">Test Voice</button>
    <button id="start" class="primary">▶ Start</button>
    <button id="redo">↶ Redo</button>
    <button id="togglePaste">Paste Script</button>
    <button id="nextComputer">Next Computer Part</button>
  </div>
  <div id="pasteBox" class="hidden"><textarea id="paste" class="paste" placeholder="Paste script text here…"></textarea><button id="loadPaste" class="primary" style="width:100%;margin:8px 0">Load Pasted Script</button></div>
  <div id="status" class="status" aria-live="polite">Load a script. Tap any cue to make it active. Use ▲/▼ or keyboard arrows to move.</div>
  <div id="script" class="script" tabindex="0" aria-label="Script"></div>
  <div class="nav"><button id="up" aria-label="Move active line up">▲</button><button id="speakCurrent" aria-label="Speak current computer line">Speak</button><button id="down" aria-label="Move active line down">▼</button></div>
  <div class="credit">CueReader · Simon Anthony — acting@torty.org.uk</div>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);const els={file:$('file'),role:$('role'),setRole:$('setRole'),voice:$('voice'),testVoice:$('testVoice'),start:$('start'),redo:$('redo'),togglePaste:$('togglePaste'),nextComputer:$('nextComputer'),pasteBox:$('pasteBox'),paste:$('paste'),loadPaste:$('loadPaste'),status:$('status'),script:$('script'),up:$('up'),down:$('down'),speakCurrent:$('speakCurrent')};
let cues=[],current=-1,myRole='',voices=[],speaking=false;const headings=new Set(['ACT','ACT ONE','ACT TWO','ACT THREE','SCENE','SCENE ONE','SCENE TWO','SCENE THREE','FADE IN','FADE OUT','FADE TO BLACK','CUT TO','DISSOLVE TO','BLACKOUT','LIGHTS OUT','THE END','END','INTERVAL','CURTAIN','TITLE','CREDITS','MONTAGE','CONTINUED',"CONT'D",'CONT’D']);
function status(s){els.status.textContent=s}function cleanName(s){return s.trim().replace(/:$/,'').trim()}
function isCharacter(line){let c=cleanName(line);if(!c||c.length>60||c.split(/\s+/).length>8)return false;if(!/[A-Z]/.test(c)||c!==c.toUpperCase())return false;let base=c.replace(/\s*\((?:CONT['’]?D|CONTINUED)\)\s*$/i,'').trim();if(headings.has(base))return false;return !/^(ACT|SCENE|FADE|CUT|DISSOLVE)\s/.test(base)}
function isNonspoken(line){let c=line.trim();if(!c)return true;let u=c.toUpperCase().replace(/^[ .:!–—-]+|[ .:!–—-]+$/g,'');if(headings.has(u))return true;return c===c.toUpperCase()&&c.split(/\s+/).length>5&&!/[.?!]/.test(c)}
function segments(text){const MARK='\uE000PAUSE\uE000';let s=text.replace(/\(\s*(?:pause|beat)\s*\)/gi,MARK);for(let i=0;i<10;i++){let old=s;s=s.replace(/\([^()]*\)|\[[^\[\]]*\]|\{[^{}]*\}|<[^<>]*>/g,' ');if(s===old)break}s=s.replace(/\.{3,}|…/g,' ');let out=[];s.split(MARK).forEach((p,i,a)=>{p=p.replace(/\s+/g,' ').replace(/^[ \-–—]+|[ \-–—]+$/g,'').trim();if(p&&!isNonspoken(p)){p=p.replace(/^(?:VOICEOVER|V\.O\.|O\.S\.|OFFSCREEN|CONTINUED)\s*[:.-]\s*/i,'').trim();if(p)out.push({kind:'text',value:p})}if(i<a.length-1)out.push({kind:'pause',value:500})});return out}
function parse(text){cues=[];current=-1;let character=null,parts=[];const save=()=>{if(character){let d=parts.join(' ').trim();if(segments(d).some(x=>x.kind==='text'))cues.push({character,dialogue:d})}};for(const raw of text.split(/\r?\n/)){let line=raw.trim();if(!line)continue;let pause=/^\(\s*(?:pause|beat)\s*\)$/i.test(line);if(!pause&&(/^\(.*\)$/.test(line)||/^\[.*\]$/.test(line)||/^\{.*\}$/.test(line)||/^<.*>$/.test(line)))continue;if(isCharacter(line)){save();character=cleanName(line).replace(/\s*\((?:CONT['’]?D|CONTINUED)\)\s*$/i,'').trim();parts=[];continue}if(!pause&&isNonspoken(line))continue;if(character)parts.push(line)}save();render();populateRoles();status(`Loaded ${cues.length} spoken cue(s). Choose your role.`)}
function render(){els.script.innerHTML='';cues.forEach((c,i)=>{let d=document.createElement('div');d.className='cue'+(c.character===myRole?' mine':'')+(i===current?' active':'');d.dataset.index=i;let sp=document.createElement('div');sp.className='speaker';sp.textContent=c.character+':';let tx=document.createElement('div');tx.textContent=c.dialogue;d.append(sp,tx);d.addEventListener('click',()=>activate(i));els.script.appendChild(d)})}
function populateRoles(){let chars=[...new Set(cues.map(c=>c.character))];els.role.innerHTML='<option value="">My role…</option>'+chars.map(c=>`<option>${escapeHtml(c)}</option>`).join('')}function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function activate(i){if(!cues.length)return;i=Math.max(0,Math.min(cues.length-1,i));current=i;render();let el=els.script.querySelector(`[data-index="${i}"]`);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});let c=cues[i];status(`${c.character===myRole?'YOUR CUE':'ACTIVE'} — ${c.character}: ${c.dialogue.slice(0,180)}`)}function move(delta){if(!cues.length)return status('Load a script first.');if(speaking)return status('Wait for the current speech to finish.');activate(current<0?(delta>0?0:cues.length-1):current+delta)}
function loadVoices(){voices=speechSynthesis.getVoices();let prev='';try{prev=localStorage.getItem('cuereaderVoice')||''}catch(_e){}els.voice.innerHTML='';if(!voices.length){let o=document.createElement('option');o.textContent='System voice';els.voice.appendChild(o);return}voices.forEach((v,i)=>{let o=document.createElement('option');o.value=String(i);o.textContent=`${v.name} (${v.lang})`;if(v.name===prev)o.selected=true;els.voice.appendChild(o)})}function chosenVoice(){let i=Number(els.voice.value);return Number.isInteger(i)&&voices[i]?voices[i]:null}
function speakText(text){return new Promise(resolve=>{if(!('speechSynthesis'in window)){status('Speech is not supported in this browser.');resolve();return}let u=new SpeechSynthesisUtterance(text);let v=chosenVoice();if(v)u.voice=v;u.rate=1;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)})}
async function speakCue(i){if(i<0||i>=cues.length)return;let c=cues[i];activate(i);if(c.character===myRole){status(`YOUR CUE — ${c.character}: ${c.dialogue.slice(0,180)}`);return}speaking=true;try{for(const seg of segments(c.dialogue)){if(seg.kind==='pause')await new Promise(r=>setTimeout(r,seg.value));else await speakText(seg.value)}}finally{speaking=false}}
function nextComputer(){if(!myRole)return status('Choose your role and tap Set My Role.');if(speaking)return status('Wait for the current speech to finish.');for(let i=current+1;i<cues.length;i++)if(cues[i].character!==myRole&&segments(cues[i].dialogue).some(x=>x.kind==='text')){speakCue(i);return}status('No further computer-spoken parts.')}function redo(){if(!myRole)return status('Choose your role first.');for(let i=Math.min(current-1,cues.length-1);i>=0;i--)if(cues[i].character!==myRole&&segments(cues[i].dialogue).some(x=>x.kind==='text')){speakCue(i);return}status('There is no earlier computer-spoken part to redo.')}
async function extractPdf(file){if(!window.pdfjsLib)throw new Error('PDF reader library did not load. Check your internet connection.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const data=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data}).promise;const pages=[];for(let n=1;n<=pdf.numPages;n++){status(`Reading PDF page ${n} of ${pdf.numPages}…`);const page=await pdf.getPage(n),content=await page.getTextContent();let line='',lastY=null,lines=[];for(const item of content.items){const y=item.transform?Math.round(item.transform[5]):null;if(lastY!==null&&y!==null&&Math.abs(y-lastY)>3){if(line.trim())lines.push(line.trim());line=''}line+=(line?' ':'')+(item.str||'');lastY=y}if(line.trim())lines.push(line.trim());pages.push(lines.join('\n'))}return pages.join('\n\n')}
async function extractDocx(file){if(!window.mammoth)throw new Error('Word reader library did not load. Check your internet connection.');const result=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return result.value||''}
async function extractLegacyDoc(file){const bytes=new Uint8Array(await file.arrayBuffer());let ascii='',utf16='';for(let i=0;i<bytes.length;i++)ascii+=bytes[i]>=32&&bytes[i]<=126?String.fromCharCode(bytes[i]):' ';for(let i=0;i+1<bytes.length;i+=2){const c=bytes[i]|(bytes[i+1]<<8);utf16+=(c===9||c===10||c===13||c>=32&&c<0xD800)?String.fromCharCode(c):' '}const tidy=t=>t.replace(/[ \t]{2,}/g,' ').replace(/\s*\r?\n\s*/g,'\n').replace(/\n{3,}/g,'\n\n').trim();ascii=tidy(ascii);utf16=tidy(utf16);const score=t=>(t.match(/[A-Za-z]{3,}/g)||[]).length;const best=score(utf16)>score(ascii)?utf16:ascii;if(score(best)<5)throw new Error('This older .doc file could not be read reliably in the browser. Save it as .docx or PDF and try again.');return best}
async function readScriptFile(f){const name=f.name.toLowerCase();if(name.endsWith('.pdf')||f.type==='application/pdf')return extractPdf(f);if(name.endsWith('.docx')||f.type==='application/vnd.openxmlformats-officedocument.wordprocessingml.document')return extractDocx(f);if(name.endsWith('.doc')||f.type==='application/msword')return extractLegacyDoc(f);if(name.endsWith('.txt')||f.type==='text/plain'||!f.type)return f.text();throw new Error('Unsupported file type. Use TXT, PDF, DOC or DOCX.')}
els.file.addEventListener('change',async()=>{const f=els.file.files[0];if(!f)return;try{status(`Opening ${f.name}…`);const text=await readScriptFile(f);if(!text.trim())throw new Error('No readable text was found in this file.');parse(text)}catch(err){console.error(err);status(err&&err.message?err.message:'Could not read this file.')}});els.togglePaste.addEventListener('click',()=>els.pasteBox.classList.toggle('hidden'));els.loadPaste.addEventListener('click',()=>{parse(els.paste.value);els.pasteBox.classList.add('hidden')});els.setRole.addEventListener('click',()=>{myRole=els.role.value;if(!myRole)return status('Choose your role first.');current=-1;render();let i=cues.findIndex(c=>c.character===myRole);if(i>=0)activate(i);else status(`No spoken dialogue found for ${myRole}.`)});els.start.addEventListener('click',()=>{if(!myRole)return status('Choose your role first.');current=-1;nextComputer()});els.nextComputer.addEventListener('click',nextComputer);els.redo.addEventListener('click',redo);els.up.addEventListener('click',()=>move(-1));els.down.addEventListener('click',()=>move(1));els.speakCurrent.addEventListener('click',()=>{if(current>=0)speakCue(current)});els.testVoice.addEventListener('click',()=>speakText('This is a test of the selected voice.'));els.voice.addEventListener('change',()=>{let v=chosenVoice();if(v){try{localStorage.setItem('cuereaderVoice',v.name)}catch(_e){}}});document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowUp'){e.preventDefault();move(-1)}else if(e.key==='ArrowDown'){e.preventDefault();move(1)}else if(e.key==='Enter'){e.preventDefault();nextComputer()}});if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}else status('This browser does not provide text-to-speech.');
})();
</script>
</body>
</html>
